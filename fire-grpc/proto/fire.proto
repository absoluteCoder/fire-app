syntax = "proto3";

package fire;

option go_package = "gen/pb";

import "google/api/annotations.proto";

service FIREService {
  rpc Ignite (FireRequest) returns (FireResponse) {
    option (google.api.http) = {
      post: "/v1/fire/ignite"
      body: "*"
    };
  }
}

message FireRequest {
  string fuel = 1;
}

message FireResponse {
  string message = 1;
}